<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neubrutalism Dark Purple Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">

    <style>
        /* --- DESIGN SYSTEM VARIABLES (VOID-PURPLE PROTOCOL) --- */
        
         :root {
            --color-bg-main: #0A0A0A;
            /* Void Dark */
            --color-bg-surface: #141414;
            /* Sedikit lebih terang untuk surface */
            --color-primary: #7000FF;
            /* Electric Purple */
            --color-text-main: #F5F5F5;
            /* Bone White */
            --color-text-muted: #A0A0A0;
            /* Silver */
            --color-accent: #CCFF00;
            /* Cyber Lime (Untuk shock value) */
            --font-heading: 'Space Grotesk', sans-serif;
            --font-body: 'JetBrains Mono', monospace;
            --border-thickness: 2px;
        }
        /* --- GLOBAL RESET & BASE STYLES --- */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--color-bg-main);
            color: var(--color-text-main);
            font-family: var(--font-body);
            /* Default menggunakan font monospace/teknikal */
            overflow-x: hidden;
        }
        /* --- HERO SECTION STYLES --- */
        
        .hero-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* Memberikan border bingkai luar yang jelas */
            border: var(--border-thickness) solid #222;
            margin: 20px;
            /* Memberi jarak dari tepi browser */
            position: relative;
            background-color: var(--color-bg-main);
        }
        /* Top Tech Bar (Status Bar) */
        
        .tech-bar {
            display: flex;
            justify-content: space-between;
            padding: 12px 24px;
            border-bottom: var(--border-thickness) solid #333;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-text-muted);
        }
        
        .tech-status::before {
            content: '●';
            color: var(--color-accent);
            margin-right: 8px;
        }
        /* Main Grid Layout */
        
        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            /* Kiri lebih lebar sedikit */
            flex-grow: 1;
            /* Mengisi sisa tinggi layar */
            border: var(--border-thickness) solid var(--color-primary);
            /* Bingkai Ungu Utama */
        }
        /* Left Content Area */
        
        .content-area {
            padding: 64px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: var(--border-thickness) solid #333;
            /* Garis pembatas vertikal */
            position: relative;
        }
        /* Typography Styles */
        
        .label-tag {
            display: inline-block;
            background: #222;
            color: var(--color-accent);
            padding: 4px 12px;
            font-weight: bold;
            margin-bottom: 24px;
            border: 1px solid var(--color-accent);
            /* Neubrutalism: Sedikit miring */
            transform: skewX(-10deg);
        }
        
        h1.hero-title {
            font-family: var(--font-heading);
            font-size: clamp(4rem, 8vw, 7rem);
            /* Responsif, sangat besar */
            line-height: 0.9;
            text-transform: uppercase;
            margin-bottom: 32px;
            font-weight: 900;
        }
        
        .highlight-purple {
            color: var(--color-primary);
            /* Memberikan efek stroke/outline pada teks */
            -webkit-text-stroke: 1px var(--color-primary);
            text-shadow: 4px 4px 0px #000;
            /* Bayangan hitam keras pada teks */
        }
        
        p.hero-description {
            font-size: 1.1rem;
            color: var(--color-text-muted);
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 48px;
            border-left: 4px solid #333;
            /* Garis aksen di kiri paragraf */
            padding-left: 24px;
        }
        /* --- BRUTAL BUTTONS --- */
        
        .cta-group {
            display: flex;
            gap: 24px;
        }
        
        .btn-brutal {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            padding: 20px 40px;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0, 0, 0.2, 1);
            /* THE BRUTAL SAUCE: 0 Radius, Tebal Border, Hard Shadow */
            border-radius: 0px;
            border: var(--border-thickness) solid var(--color-text-main);
            position: relative;
        }
        /* Primary Button Style (Purple) */
        
        .btn-primary {
            background-color: var(--color-primary);
            color: var(--color-text-main);
            /* Bayangan awal: Hitam keras */
            box-shadow: 8px 8px 0px 0px #000000;
        }
        
        .btn-primary:hover {
            /* Saat hover, ganti warna jadi Lime untuk kontras ekstrem */
            background-color: var(--color-accent);
            color: #000000;
            border-color: var(--color-accent);
            /* Bayangan berubah jadi putih */
            box-shadow: 10px 10px 0px 0px var(--color-text-main);
            transform: translate(-4px, -4px);
        }
        
        .btn-primary:active {
            /* Efek ditekan fisik */
            box-shadow: 0px 0px 0px 0px #000;
            transform: translate(4px, 4px);
        }
        /* Secondary Button Style (Outline) */
        
        .btn-secondary {
            background-color: transparent;
            color: var(--color-text-main);
            box-shadow: 8px 8px 0px 0px var(--color-primary);
            /* Bayangan Ungu */
        }
        
        .btn-secondary:hover {
            background-color: var(--color-text-main);
            color: #000000;
            box-shadow: 10px 10px 0px 0px var(--color-primary);
            transform: translate(-4px, -4px);
        }
        
        .btn-secondary:active {
            box-shadow: 0px 0px 0px 0px;
            transform: translate(4px, 4px);
        }
        /* Right Visual Area (Placeholder) */
        
        .visual-area {
            background-color: var(--color-bg-surface);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            /* Membuat pola grid background teknikal */
            background-image: linear-gradient(rgba(112, 0, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(112, 0, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        .visual-placeholder-box {
            width: 300px;
            height: 400px;
            border: 4px dashed var(--color-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-heading);
            font-weight: 900;
            color: var(--color-primary);
            font-size: 2rem;
            text-align: center;
            /* Rotasi sedikit untuk kesan tidak teratur */
            transform: rotate(5deg);
            background: rgba(112, 0, 255, 0.05);
        }
        /* Responsiveness dasar */
        
        @media (max-width: 900px) {
            .hero-grid {
                grid-template-columns: 1fr;
                /* Stack vertikal di layar kecil */
            }
            .visual-area {
                min-height: 300px;
                border-top: var(--border-thickness) solid #333;
                border-right: none;
            }
            .content-area {
                padding: 40px 24px;
            }
            .cta-group {
                flex-direction: column;
            }
            .btn-brutal {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="hero-container">
        <div class="tech-bar">
            <div class="tech-status">System Status: Stable</div>
            <div>Protocol: VOID-PURPLE v.1.0</div>
        </div>

        <div class="hero-grid">
            <section class="content-area">
                <div>
                    <span class="label-tag"># SYSTEMS READY // 2077</span>
                </div>
                <h1 class="hero-title">
                    We Build The <br>
                    <span class="highlight-purple">Future Raw.</span>
                </h1>
                <p class="hero-description">
                    // Menerapkan estetika brutal dengan kontras tinggi. Tanpa gradasi halus. Tanpa kompromi. Data visual murni dalam mode gelap.
                </p>
                <div class="cta-group">
                    <button class="btn-brutal btn-primary">INITIATE PROJECT</button>
                    <button class="btn-brutal btn-secondary">VIEW DOCUMENTATION</button>
                </div>
            </section>

            <aside class="visual-area">
                <div class="visual-placeholder-box">
                    VISUAL<br>DATA<br>STREAM<br>[ERROR]
                </div>
            </aside>
        </div>
    </main>

</body>

</html>
